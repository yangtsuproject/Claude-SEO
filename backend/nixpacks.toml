# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
  "echo '=== RUNNING MIGRATION FIX IN BUILD PHASE ===' && node scripts/fix-migration.js || echo 'Fix script failed but continuing'"
]

[start]
cmd = "npx prisma migrate deploy && node dist/index.js"
