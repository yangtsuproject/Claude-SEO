# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx prisma generate", "npm run build", "node scripts/fix-migration.js || true"]

[start]
cmd = "npx prisma migrate resolve --applied 20251222000000_init && npx prisma migrate deploy && node dist/index.js"
